name: Windows 11 Enterprise LTSC 2024 - ISO-ESD-W10UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    - name: LIMPAR AMBIENTE TOTAL
      shell: cmd
      run: |
        rmdir /s /q D:\W10UI 2>nul
        rmdir /s /q D:\BASEISO 2>nul
        rmdir /s /q UUP 2>nul
        rmdir /s /q D:\W10UI_TEMP 2>nul
        rmdir /s /q D:\W10UI_MNT 2>nul
        rmdir /s /q D:\W10UI_MRE 2>nul
        rmdir /s /q D:\W10UI_ISO 2>nul
        del /f /q *.iso 2>nul
        del /f /q base.7z.* 2>nul

    - name: Instalar ferramentas
      shell: cmd
      run: |
        choco install 7zip -y
        choco install aria2 -y

    - name: Criar pastas de trabalho
      shell: cmd
      run: |
        mkdir D:\W10UI
        mkdir D:\BASEISO
        mkdir D:\W10UI_TEMP
        mkdir D:\W10UI_MNT
        mkdir D:\W10UI_MRE
        mkdir D:\W10UI_ISO
        mkdir UUP

    - name: Extrair W10UI base
      shell: cmd
      run: |
        7z x W10UI_RAIZ.zip -oD:\W10UI -y

        if not exist D:\W10UI\Files\W10UI.cmd (
          echo ERRO: W10UI.cmd nao encontrado.
          exit /b 1
        )

    - name: Baixar ISO original LTSC 2024
      shell: cmd
      run: |
        aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 -o base.7z.001 "https://github.com/Loopz976/gerar-iso-windows-uupdump/releases/download/windows-11-enterprise-ltsc-2024-original/pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z.001"
        if errorlevel 1 exit /b 1

        aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 -o base.7z.002 "https://github.com/Loopz976/gerar-iso-windows-uupdump/releases/download/windows-11-enterprise-ltsc-2024-original/pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z.002"
        if errorlevel 1 exit /b 1

        aria2c -x16 -s16 -k1M --retry-wait=5 --max-tries=5 -o base.7z.003 "https://github.com/Loopz976/gerar-iso-windows-uupdump/releases/download/windows-11-enterprise-ltsc-2024-original/pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z.003"
        if errorlevel 1 exit /b 1

    - name: Validar arquivo compactado original
      shell: cmd
      run: |
        7z t base.7z.001

        if errorlevel 1 (
          echo ERRO: arquivo dividido incompleto ou invalido.
          exit /b 1
        )

    - name: Extrair ISO original
      shell: cmd
      run: |
        7z x base.7z.001 -y

        if errorlevel 1 exit /b 1

        if not exist pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.iso (
          echo ERRO: ISO original nao encontrada.
          exit /b 1
        )

    - name: Extrair ISO para BASEISO
      shell: cmd
      run: |
        7z x pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.iso -oD:\BASEISO -y

        if errorlevel 1 exit /b 1

    - name: Validar WIM
      shell: cmd
      run: |
        if not exist D:\BASEISO\sources\install.wim (
          echo ERRO: install.wim nao encontrado.
          exit /b 1
        )

        dism /Get-WimInfo /WimFile:D:\BASEISO\sources\install.wim

        if errorlevel 1 exit /b 1

    - name: Preparar UUP
      shell: cmd
      run: |
        if not exist w11-24h2-ltsc-upp.zip (
          echo ERRO: w11-24h2-ltsc-upp.zip nao encontrado no repositorio.
          exit /b 1
        )

        7z x w11-24h2-ltsc-upp.zip -oUUP -y

        if errorlevel 1 exit /b 1

        if not exist UUP\uup_download_windows.cmd (
          echo ERRO: uup_download_windows.cmd nao encontrado.
          exit /b 1
        )

        if not exist UUP\files mkdir UUP\files

        copy /y "%ProgramData%\chocolatey\bin\aria2c.exe" UUP\files\aria2c.exe

    - name: Baixar updates UUP
      shell: cmd
      working-directory: UUP
      run: |
        call uup_download_windows.cmd

        if errorlevel 1 exit /b 1

    - name: Copiar updates
      shell: cmd
      run: |
        if not exist UUP\UUPs (
          echo ERRO: pasta UUPs nao encontrada.
          exit /b 1
        )

        xcopy UUP\UUPs\* D:\W10UI\Files\ /E /H /C /I /Y

        if errorlevel 1 exit /b 1

    - name: Preparar dirs W10UI
      shell: cmd
      run: |
        mkdir D:\W10UI_TEMP
        mkdir D:\W10UI_MNT
        mkdir D:\W10UI_MRE
        mkdir D:\W10UI_ISO

    - name: Ajustar INI COMPLETO
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $ini = "D:\W10UI\Files\W10UI.ini"

        if (!(Test-Path $ini)) {
          throw "W10UI.ini nao encontrado."
        }

        $txt = Get-Content $ini -Raw

        $settings = @{
          'Target'     = 'D:\BASEISO'
          'Repo'       = 'D:\W10UI\Files'
          'MountDir'   = 'D:\W10UI_MNT'
          'WinreMount' = 'D:\W10UI_MRE'
          '_CabDir'    = 'D:\W10UI_TEMP'
          'ISODir'     = 'D:\W10UI_ISO'
          'AutoStart'  = '1'
          'ISO'        = '1'
        }

        foreach ($key in $settings.Keys) {
          $pattern = "(?im)^" + [regex]::Escape($key) + "\s*=.*$"
          $replacement = "$key        =$($settings[$key])"

          if ($txt -match $pattern) {
            $txt = [regex]::Replace($txt, $pattern, $replacement)
          }
          else {
            $txt += "`r`n$replacement"
          }
        }

        Set-Content -Path $ini -Value $txt -Encoding ASCII

        Write-Host "Configuracao W10UI:"
        Get-Content $ini

    - name: Limpeza DISM
      shell: cmd
      run: |
        dism /Cleanup-Wim

    - name: Rodar W10UI
      shell: cmd
      working-directory: D:\W10UI\Files
      run: |
        call W10UI.cmd

        if errorlevel 1 exit /b 1

    - name: Validar ISO final
      id: iso
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        $iso = Get-ChildItem D:\W10UI_ISO -Filter *.iso -File |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1

        if (!$iso) {
          throw "Nenhuma ISO final foi gerada pelo W10UI."
        }

        $hash = Get-FileHash $iso.FullName -Algorithm SHA256

        Write-Host "ISO final: $($iso.FullName)"
        Write-Host "Tamanho: $([math]::Round($iso.Length / 1GB, 2)) GB"
        Write-Host "SHA256: $($hash.Hash)"

        "iso=$($iso.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Compactar ISO em partes de 1900 MB
      shell: cmd
      run: |
        7z a -t7z -mx=1 -v1900m Windows11LTSC2024ESDW10UI.7z "${{ steps.iso.outputs.iso }}"

        if errorlevel 1 exit /b 1

    - name: Validar arquivo dividido
      shell: cmd
      run: |
        if not exist Windows11LTSC2024ESDW10UI.7z.001 (
          echo ERRO: arquivo .001 nao encontrado.
          exit /b 1
        )

        7z t Windows11LTSC2024ESDW10UI.7z.001

        if errorlevel 1 exit /b 1

    - name: Publicar Release
      uses: ncipollo/release-action@v1
      with:
        tag: windows-11-ltsc-2024-w10ui-${{ github.run_number }}
        name: Windows 11 Enterprise LTSC 2024 - Update ESD ISO W10UI
        body: |
          Windows 11 Enterprise LTSC 2024 x64.
          Idioma: Português do Brasil.
          Base: ISO LTSC 2024 original.
          Atualizações integradas com W10UI.
          Arquivo 7z dividido em partes de aproximadamente 1900 MB.
          SHA256 da ISO final disponível nos logs do workflow.
        artifacts: Windows11LTSC2024ESDW10UI.7z.*
        artifactErrorsFailBuild: true
        allowUpdates: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
