name: Windows 11 Enterprise LTSC 2024 - ISO Original

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-iso:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Instalar 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y

          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"

          if (!(Test-Path $sevenZip)) {
            $sevenZip = "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          }

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip não encontrado."
          }

          "SEVENZIP=$sevenZip" | Out-File $env:GITHUB_ENV -Append

      - name: Preparar ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "D:\WIN11_ISO" -Force | Out-Null
          New-Item -ItemType Directory -Path "D:\WIN11_RELEASE" -Force | Out-Null

      - name: Baixar ISO original
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://tempdelivery.13376767.xyz/db/pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.iso?t=IVAvx3J6lgibNK7S&a=273312&u=4aEKp6MOyHIQICtM&sig=aca3466b1d75d23e9d6e0110dcddc2a43c7848eb5cdf7dd0c8811c67e7b495d3"

          $iso = "D:\WIN11_ISO\pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.iso"

          curl.exe --fail --location --retry 3 --retry-delay 5 --output "$iso" "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha no download. O link pode ter expirado."
          }

          if (!(Test-Path $iso)) {
            throw "ISO não encontrada."
          }

          $file = Get-Item $iso

          if ($file.Length -lt 1GB) {
            throw "Download inválido: arquivo menor que 1 GB."
          }

          Write-Host "Nome original: $($file.Name)"
          Write-Host "Tamanho: $([math]::Round($file.Length / 1GB, 2)) GB"

          $hash = Get-FileHash $iso -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"

      - name: Validar ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "D:\WIN11_ISO\pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.iso"

          & $env:SEVENZIP t $iso

          if ($LASTEXITCODE -ne 0) {
            throw "A ISO falhou no teste de integridade."
          }

          $disk = Mount-DiskImage -ImagePath $iso -PassThru

          try {
            $volume = $disk | Get-Volume
            $driveLetter = $volume.DriveLetter

            if (!$driveLetter) {
              throw "Não foi possível identificar a unidade da ISO."
            }

            $drive = "${driveLetter}:"

            if (!(Test-Path "$drive\sources\boot.wim")) {
              throw "sources\boot.wim não encontrado."
            }

            if (
              !(Test-Path "$drive\sources\install.wim") -and
              !(Test-Path "$drive\sources\install.esd")
            ) {
              throw "install.wim/install.esd não encontrado."
            }

            Write-Host "Estrutura da ISO validada."
          }
          finally {
            Dismount-DiskImage -ImagePath $iso
          }

      - name: Compactar ISO em partes de 1900 MB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "D:\WIN11_ISO\pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.iso"
          $output = "D:\WIN11_RELEASE\pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z"

          & $env:SEVENZIP a -t7z -mx=1 -v1900m $output $iso

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na compactação."
          }

          $parts = @(
            Get-ChildItem "D:\WIN11_RELEASE\pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z.*" -File |
            Sort-Object Name
          )

          if ($parts.Count -eq 0) {
            throw "Nenhuma parte foi gerada."
          }

          foreach ($part in $parts) {
            Write-Host "$($part.Name): $([math]::Round($part.Length / 1MB, 2)) MB"
          }

          Write-Host "Total de partes: $($parts.Count)"

      - name: Validar arquivo dividido
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $first = "D:\WIN11_RELEASE\pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z.001"

          if (!(Test-Path $first)) {
            throw "Arquivo .001 não encontrado."
          }

          & $env:SEVENZIP t $first

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na validação do arquivo dividido."
          }

          Write-Host "Arquivo dividido validado."

      - name: Publicar ISO na Release
        uses: ncipollo/release-action@v1
        with:
          tag: windows-11-enterprise-ltsc-2024-original
          name: Windows 11 Enterprise LTSC 2024 - ISO Original
          body: |
            Windows 11 Enterprise LTSC 2024 x64.
            Idioma: Português do Brasil.
            Arquivo ISO preservado com o nome original.
            Formato de publicação: arquivo 7z dividido em partes de aproximadamente 1900 MB.
            O SHA256 da ISO original é registrado nos logs da execução do workflow.
          artifacts: D:/WIN11_RELEASE/pt-br_windows_11_enterprise_ltsc_2024_x64_dvd_2bb6b75b.7z.*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
