name: Windows 11 26H2 - ISO Original Microsoft

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-iso:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Instalar 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y

          $sevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"

          if (!(Test-Path $sevenZip)) {
            $sevenZip = "${env:ProgramFiles(x86)}\7-Zip\7z.exe"
          }

          if (!(Test-Path $sevenZip)) {
            throw "7-Zip não encontrado."
          }

          "SEVENZIP=$sevenZip" | Out-File $env:GITHUB_ENV -Append

      - name: Preparar ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "D:\WIN11_ISO" -Force | Out-Null
          New-Item -ItemType Directory -Path "D:\WIN11_RELEASE" -Force | Out-Null

      - name: Baixar ISO original da Microsoft
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://software.download.prss.microsoft.com/dbazure/Windows11_Client_x64_pt-br_26300_9457.iso?t=90f4fe2a-46bb-491c-8b18-511e609e7b35&P1=1791663668&P2=602&P3=2&P4=fa1X4yo%2bCERFj7AaMAclyXAVUm05ID3O6WqSJUOJcwcPshW1Mr%2bXHYlnPEuvpOu4i%2bLTn14%2b5EHr74j908ZU7aZQtLS2kquK7UmpPXwIh%2f9xpEBOJfK2N8a5uAjesXu1cZaSOJ1NjxBeNVcKIQ7WoSMoNnuLI1O9K%2fXBCXEcjW0fLMvw9gJGreeqLNOErfZ1EdIpX4wpf8LOPwA4N%2bwt8Kz%2fJtMOQ4FUJE8igPQnPXVsKd0tMCE8GiG8T75veiz21t7tyoALh16JhO%2fuZLizq%2fUwqsauclYTThpw6Fn2JRWxd6WTUAEGAGs3FnpsskfMFL%2fCRNpBWpv3%2frFYw0CFFw%3d%3d"

          $iso = "D:\WIN11_ISO\Windows11-Original.iso"

          curl.exe --fail --location --retry 3 --retry-delay 5 --output "$iso" "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha no download. O link da Microsoft pode ter expirado."
          }

          if (!(Test-Path $iso)) {
            throw "ISO não encontrada."
          }

          $file = Get-Item $iso

          if ($file.Length -lt 1GB) {
            throw "Download inválido: arquivo menor que 1 GB."
          }

          Write-Host "Tamanho: $([math]::Round($file.Length / 1GB, 2)) GB"

          $hash = Get-FileHash $iso -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"

      - name: Validar ISO
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "D:\WIN11_ISO\Windows11-Original.iso"

          & $env:SEVENZIP t $iso

          if ($LASTEXITCODE -ne 0) {
            throw "A ISO falhou no teste de integridade."
          }

          $disk = Mount-DiskImage -ImagePath $iso -PassThru

          try {
            $volume = $disk | Get-Volume
            $drive = "$($volume.DriveLetter):"

            if (!(Test-Path "$drive\sources\boot.wim")) {
              throw "sources\boot.wim não encontrado."
            }

            if (
              !(Test-Path "$drive\sources\install.wim") -and
              !(Test-Path "$drive\sources\install.esd")
            ) {
              throw "install.wim/install.esd não encontrado."
            }

            Write-Host "Estrutura da ISO validada."
          }
          finally {
            Dismount-DiskImage -ImagePath $iso
          }

      - name: Compactar ISO em partes de 1900 MB
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $iso = "D:\WIN11_ISO\Windows11-Original.iso"
          $output = "D:\WIN11_RELEASE\Win11-26H2-Original.7z"

          & $env:SEVENZIP a -t7z -mx=1 -v1900m $output $iso

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na compactação."
          }

          $parts = @(
            Get-ChildItem "D:\WIN11_RELEASE\Win11-26H2-Original.7z.*" -File |
            Sort-Object Name
          )

          if ($parts.Count -eq 0) {
            throw "Nenhuma parte foi gerada."
          }

          foreach ($part in $parts) {
            Write-Host "$($part.Name): $([math]::Round($part.Length / 1MB, 2)) MB"
          }

          Write-Host "Total de partes: $($parts.Count)"

      - name: Validar arquivo dividido
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $first = "D:\WIN11_RELEASE\Win11-26H2-Original.7z.001"

          if (!(Test-Path $first)) {
            throw "Arquivo .001 não encontrado."
          }

          & $env:SEVENZIP t $first

          if ($LASTEXITCODE -ne 0) {
            throw "Falha na validação do arquivo dividido."
          }

          Write-Host "Arquivo dividido validado."

      - name: Publicar ISO original na Release
        uses: ncipollo/release-action@v1
        with:
          tag: win11-26h2-original
          name: Windows 11 - ISO Original Microsoft
          body: |
            ISO original do Windows 11 em português do Brasil.
            Origem: servidor de download da Microsoft.
            Formato: arquivo 7z dividido em partes de aproximadamente 1900 MB.
          artifacts: D:/WIN11_RELEASE/Win11-26H2-Original.7z.*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
